<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Deep Obsidian Canvas -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090A0F" />
      <stop offset="100%" stop-color="#020305" />
    </linearGradient>

    <!-- Subdued Luxury Border -->
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#1E1B4B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#4338CA" stop-opacity="0.6" />
    </linearGradient>

    <!-- Facet 1: Top Dynamic Beam -->
    <linearGradient id="facetTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Facet 2: Left Power Spine -->
    <linearGradient id="facetLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>

    <!-- Facet 3: Base Foundation Bar -->
    <linearGradient id="facetBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3730A3" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Facet 4: Right Upward Prow -->
    <linearGradient id="facetRight" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Facet 5: Inward Core Vector (G Nexus) -->
    <linearGradient id="facetCore" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C7D2FE" />
    </linearGradient>

    <!-- Specular Blade Reflection Edge -->
    <linearGradient id="bladeEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#A5B4FC" stop-opacity="0.1" />
    </linearGradient>

    <!-- Sharp Drop Shadow for 3D Floating Geometry -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- 1. Obsidian Foundation Plate -->
  <rect
    x="24"
    y="24"
    width="464"
    height="464"
    rx="112"
    ry="112"
    fill="url(#bg)"
    stroke="url(#border)"
    stroke-width="3"
  />

  <!-- 2. The Architectural Monogram 'G' -->
  <g filter="url(#shadow)">
    <!-- Facet 1: Top Chamfered Wing -->
    <polygon
      points="132,136 384,136 340,196 176,196"
      fill="url(#facetTop)"
    />

    <!-- Facet 2: Left Spine (Structural Pillar) -->
    <polygon
      points="132,136 176,196 176,324 132,376"
      fill="url(#facetLeft)"
    />

    <!-- Facet 3: Bottom Foundation Wing -->
    <polygon
      points="132,376 176,324 336,324 380,376"
      fill="url(#facetBase)"
    />

    <!-- Facet 4: Right Upward Spine -->
    <polygon
      points="380,376 336,324 336,252 380,252"
      fill="url(#facetRight)"
    />

    <!-- Facet 5: Inward Core Vector (The 'G' Crossbeam) -->
    <polygon
      points="380,252 232,252 264,196 380,196"
      fill="url(#facetCore)"
    />

    <!-- 3. Razor-Sharp Specular Light Ribbons (Precision Laser Bevels) -->
    <!-- Top inner light edge -->
    <line x1="176" y1="196" x2="340" y2="196" stroke="url(#bladeEdge)" stroke-width="2.5" />
    <!-- Core upper reflection line -->
    <line x1="264" y1="196" x2="380" y2="196" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.8" />
    <!-- Left interior edge -->
    <line x1="176" y1="196" x2="176" y2="324" stroke="url(#bladeEdge)" stroke-width="2.5" />
    <!-- Outer perimeter accent line -->
    <polyline
      points="378,140 136,140 136,372 376,372"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="1.5"
      stroke-opacity="0.25"
    />
  </g>
</svg>