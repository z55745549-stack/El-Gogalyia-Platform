<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <style>
    <![CDATA[
    :root {
      --tile-bg: #FFFFFF;
      --tile-stroke: #E2E8F0;
      --g-primary: #0F172A;
      --g-accent: #2563EB;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --tile-bg: #090B11;
        --tile-stroke: #1E2330;
        --g-primary: #FFFFFF;
        --g-accent: #38BDF8;
      }
    }

    .tile-rect {
      fill: var(--tile-bg);
      stroke: var(--tile-stroke);
    }
    .g-body {
      stroke: var(--g-primary);
    }
    .g-bar {
      stroke: var(--g-accent);
    }
    ]]>
  </style>

  <!-- 1. Clean Obsidian / Ceramic Adaptive Tile -->
  <rect
    x="24"
    y="24"
    width="464"
    height="464"
    rx="124"
    ry="124"
    class="tile-rect"
    stroke-width="4"
  />

  <!-- 2. Pure Mathematical Modern 'G' Monogram -->
  <!-- Outer Circular Sweep -->
  <path
    d="M 352 160 
       A 136 136 0 1 0 352 352 
       L 352 256"
    class="g-body"
    stroke-width="56"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Precision Horizontal Crossbeam -->
  <path
    d="M 352 256 L 244 256"
    class="g-bar"
    stroke-width="56"
    stroke-linecap="round"
    fill="none"
  />
</svg>