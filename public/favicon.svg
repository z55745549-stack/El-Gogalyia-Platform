<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Deep Obsidian Ceramic Base -->
    <linearGradient id="obsidianBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090B11" />
      <stop offset="50%" stop-color="#0E121C" />
      <stop offset="100%" stop-color="#05070A" />
    </linearGradient>

    <!-- Executive Precision Bevel Rim -->
    <linearGradient id="precisionRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.6" />
    </linearGradient>

    <!-- Left Bracket < (Balanced Royal Electric Blue & Sapphire) -->
    <linearGradient id="bracketLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="45%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Right Bracket > (Balanced Electric Violet & Cyber Cyan) -->
    <linearGradient id="bracketRightGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Dynamic Center Code Slash / (Platinum Chrome with Crisp Contrast) -->
    <linearGradient id="slashGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Specular Blade Highlight -->
    <linearGradient id="laserReflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15" />
    </linearGradient>

    <!-- Refined Architectural Shadow -->
    <filter id="crispShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- 1. Obsidian Tile Container with Precision Chamfered Corners -->
  <rect
    x="24"
    y="24"
    width="464"
    height="464"
    rx="120"
    ry="120"
    fill="url(#obsidianBg)"
    stroke="url(#precisionRim)"
    stroke-width="3"
  />

  <!-- 2. GDG Executive Code Emblem < / > -->
  <g filter="url(#crispShadow)">
    <!-- Left Bracket < -->
    <polygon
      points="186,126 78,256 186,386 226,346 148,256 226,166"
      fill="url(#bracketLeftGrad)"
    />

    <!-- Dynamic Angled Center Slash / -->
    <polygon
      points="272,118 314,118 240,394 198,394"
      fill="url(#slashGrad)"
    />

    <!-- Right Bracket > -->
    <polygon
      points="326,126 434,256 326,386 286,346 364,256 286,166"
      fill="url(#bracketRightGrad)"
    />

    <!-- 3. Laser Specular Precision Edges -->
    <!-- Left Bracket Top Lead Edge -->
    <line x1="78" y1="256" x2="186" y2="126" stroke="url(#laserReflection)" stroke-width="2.5" stroke-linecap="round" />
    <!-- Right Bracket Top Lead Edge -->
    <line x1="326" y1="126" x2="434" y2="256" stroke="url(#laserReflection)" stroke-width="2.5" stroke-linecap="round" />
    <!-- Slash Top Bevel Head -->
    <line x1="272" y1="118" x2="314" y2="118" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>