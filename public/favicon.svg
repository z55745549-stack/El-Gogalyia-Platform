<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient: Violet/Indigo to Cyan/Blue -->
    <linearGradient id="iconBg" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="35%" stop-color="#6C63FF" />
      <stop offset="70%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Subtle Top Highlight Glow -->
    <linearGradient id="topGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Amber / Gold Core Gradient -->
    <linearGradient id="goldCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="60%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Drop Shadow for White Arc & Center Dot -->
    <filter id="elementShadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <!-- Soft Glow for Golden Core -->
    <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Transparent Outside - Main Squircle App Icon -->
  <rect
    x="32"
    y="32"
    width="448"
    height="448"
    rx="124"
    ry="124"
    fill="url(#iconBg)"
  />

  <!-- Subtle Rim Light -->
  <rect
    x="32"
    y="32"
    width="448"
    height="448"
    rx="124"
    ry="124"
    fill="url(#topGlow)"
    stroke="rgba(255, 255, 255, 0.28)"
    stroke-width="5"
  />

  <!-- 2. White Arc 'C' Emblem -->
  <!-- Center at (248, 256), Radius = 104 -->
  <!-- Opening from 38° to 322° facing right -->
  <path
    d="M 330 192 A 104 104 0 1 0 330 320"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="38"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#elementShadow)"
  />

  <!-- 3. Glowing Amber / Golden Center Dot -->
  <circle
    cx="248"
    cy="256"
    r="34"
    fill="url(#goldCore)"
    filter="url(#goldGlow)"
  />
</svg>