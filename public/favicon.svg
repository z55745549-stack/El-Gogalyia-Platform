<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <style>
    /* ─── Dynamic Adaptive Theme Engine ─── */
    /* Light Mode Default (Executive Platinum & Midnight Obsidian) */
    :root {
      --bg-fill: #FFFFFF;
      --bg-stroke: #E2E8F0;
      --monogram-primary: #0F172A;
      --monogram-secondary: #2563EB;
      --monogram-accent: #4F46E5;
      --center-node: #3B82F6;
    }

    /* Dark Mode (Deep Cyber Stealth & Pure Luminous Platinum) */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-fill: #090B10;
        --bg-stroke: #1E2330;
        --monogram-primary: #FFFFFF;
        --monogram-secondary: #818CF8;
        --monogram-accent: #38BDF8;
        --center-node: #60A5FA;
      }
    }

    .tile-bg {
      fill: var(--bg-fill);
      stroke: var(--bg-stroke);
      transition: all 0.3s ease;
    }
    .glyph-primary {
      fill: var(--monogram-primary);
      transition: fill 0.3s ease;
    }
    .glyph-secondary {
      fill: var(--monogram-secondary);
      transition: fill 0.3s ease;
    }
    .glyph-accent {
      fill: var(--monogram-accent);
      transition: fill 0.3s ease;
    }
    .glyph-stroke {
      stroke: var(--monogram-primary);
      transition: stroke 0.3s ease;
    }
    .glyph-node {
      fill: var(--center-node);
      transition: fill 0.3s ease;
    }
  </style>

  <!-- 1. Adaptive Squircle Tile Container -->
  <rect
    x="24"
    y="24"
    width="464"
    height="464"
    rx="124"
    ry="124"
    class="tile-bg"
    stroke-width="3"
  />

  <!-- 2. The Minimalist Executive "G" Nexus Monogram -->
  <!-- Mathematical Continuous Hex-Prism 'G' Form -->
  <g transform="translate(256, 256)">
    <!-- Outer Sweep: Main Structural Body of G -->
    <path
      d="M 64 -148 
         C 14 -148 -44 -148 -96 -118 
         C -152 -84 -180 -24 -180 40 
         C -180 110 -144 168 -88 196 
         C -36 222 36 224 94 196 
         C 152 168 184 116 184 48 
         L 184 12 
         L 0 12 
         L 0 56 
         L 132 56 
         C 128 92 104 126 66 148 
         C 28 168 -24 168 -62 148 
         C -102 126 -126 84 -126 38 
         C -126 -10 -106 -52 -70 -74 
         C -36 -96 6 -96 46 -76 
         L 76 -120 
         C 46 -138 6 -148 64 -148 
         Z"
      class="glyph-primary"
    />

    <!-- Dynamic Aerodynamic Blade (Upper-Right Crown Accent) -->
    <path
      d="M 80 -148 
         L 174 -148 
         L 134 -88 
         L 44 -88 
         Z"
      class="glyph-secondary"
    />

    <!-- Forward-Leaning Center Core Vector (The Energy Gateway) -->
    <polygon
      points="0,12 52,-56 184,-56 132,12"
      class="glyph-accent"
      opacity="0.9"
    />

    <!-- Precision Core Node (The Nexus Dot) -->
    <circle
      cx="64"
      cy="-22"
      r="16"
      class="glyph-node"
    />
  </g>
</svg>