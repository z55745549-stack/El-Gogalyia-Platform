<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Deep Obsidian Titanium Canvas -->
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E" />
      <stop offset="50%" stop-color="#0B0D14" />
      <stop offset="100%" stop-color="#040508" />
    </linearGradient>

    <!-- Executive Metallic Rim -->
    <linearGradient id="rimStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.6" />
    </linearGradient>

    <!-- GDG Left Bracket < (Sapphire & Electric Indigo) -->
    <linearGradient id="gdgLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="40%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- GDG Right Bracket > (Vivid Cyan & Electric Cobalt) -->
    <linearGradient id="gdgRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Center Slash / Core Laser (Platinum Chrome & Pure Light) -->
    <linearGradient id="gdgCenter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Laser Specular Edge Highlight -->
    <linearGradient id="laserSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1" />
    </linearGradient>

    <!-- 3D Shadow Depth -->
    <filter id="bracketShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.85" />
    </filter>

    <!-- Ambient Core Glow -->
    <filter id="ambientLight" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <!-- 1. Executive Squircle Base -->
  <rect
    x="24"
    y="24"
    width="464"
    height="464"
    rx="116"
    ry="116"
    fill="url(#canvasBg)"
    stroke="url(#rimStroke)"
    stroke-width="3"
  />

  <!-- 2. Subtle Ethereal Cyber Atmosphere in Background -->
  <circle cx="160" cy="256" r="100" fill="#4F46E5" opacity="0.18" filter="url(#ambientLight)" />
  <circle cx="350" cy="256" r="100" fill="#06B6D4" opacity="0.18" filter="url(#ambientLight)" />

  <!-- 3. GDG Enterprise Insignia < / > -->
  <g filter="url(#bracketShadow)">
    <!-- Left Bracket < -->
    <polygon
      points="198,124 78,256 198,388 238,348 152,256 238,164"
      fill="url(#gdgLeft)"
    />

    <!-- Right Bracket > -->
    <polygon
      points="314,124 434,256 314,388 274,348 360,256 274,164"
      fill="url(#gdgRight)"
    />

    <!-- Center Executive Slash / -->
    <polygon
      points="278,124 246,124 234,388 266,388"
      fill="url(#gdgCenter)"
    />

    <!-- 4. Precision Laser-Etched Chamfer Accents -->
    <!-- Left bracket top edge specular shine -->
    <line x1="78" y1="256" x2="198" y2="124" stroke="url(#laserSheen)" stroke-width="2.5" stroke-linecap="round" />
    <!-- Right bracket bottom edge specular shine -->
    <line x1="434" y1="256" x2="314" y2="388" stroke="url(#laserSheen)" stroke-width="2.5" stroke-linecap="round" />
    <!-- Slash top bevel shine -->
    <line x1="246" y1="124" x2="278" y2="124" stroke="#FFFFFF" stroke-width="2" />
  </g>
</svg>